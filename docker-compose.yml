services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devops-intern-app

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      NODE_ENV: production

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s